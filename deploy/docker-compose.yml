# docker compose -f deploy/docker-compose.yml up -d --build   (run from the project root)
services:
  saloone-frontend:
    build: { context: .., dockerfile: deploy/Dockerfile }
    restart: unless-stopped
    environment:
      ODOO_URL: http://host.docker.internal:8069   # your Odoo address as seen from the container
      ODOO_DB: your_database_name
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:3000:3000"]                  # nginx publishes it; not exposed directly
