# /etc/nginx/sites-available/otm-app  – replace app.example.com, then:  certbot --nginx -d app.example.com
server {
    listen 80;
    server_name app.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name app.example.com;
    # ssl_certificate / ssl_certificate_key are filled in by certbot

    client_max_body_size 25m;                       # payment proof / attachment uploads
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # needed so cookies are marked Secure
    }
}
# Odoo itself should stay private: bind it to 127.0.0.1 (xmlrpc_interface / http_interface) or firewall port 8069.
